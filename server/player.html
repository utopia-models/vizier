<!doctype html>
<meta charset="utf-8">
<title>Vizier clip player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #card { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #5a0d0d; color: #fff;
          font: 700 44px system-ui, sans-serif; text-align: center; }
</style>
<video id="v" muted playsinline preload="auto"></video>
<div id="card"></div>
<script>
// Follows the Vizier reading cursor (GET /events). Every change of the row index plays clips/<slug>/row-<i>.webm from its
// start: Down plays the next row's clip, Up replays the previous row's. The page never takes keys (no focusable element,
// pointer hidden) and never posts to the cursor; it only reads it and reports each start to POST /player/log.
const Q = new URLSearchParams(location.search);
const SLUG = Q.get("slug") || "current", EXT = Q.get("ext") || "webm";
const v = document.getElementById("v"), card = document.getElementById("card");
let lastSeq = -1, lastIdx = null, token = 0;
const post = (o) => fetch("/player/log", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o) }).catch(() => {});

function showCard(text) { card.textContent = text; card.style.display = "flex"; v.style.visibility = "hidden"; }
function hideCard() { card.style.display = "none"; v.style.visibility = "visible"; }

function play(cur, recvAt) {
  const idx = cur.current_line_index, my = ++token;
  if (idx === null || idx === undefined || idx < 0) { v.pause(); v.removeAttribute("src"); hideCard(); v.style.visibility = "hidden"; return; }
  const clip = `/clips/${encodeURIComponent(SLUG)}/row-${idx}.${EXT}`;
  const serverMs = cur.updated_at ? Math.max(0, Date.now() - cur.updated_at * 1000) : null;
  const miss = () => { if (my !== token) return; showCard(`no clip for row ${idx}`); post({ event: "missing", row: idx, seq: cur.seq, clip }); };
  v.onerror = miss;
  v.onplaying = () => {
    if (my !== token) return; v.onplaying = null; hideCard();
    post({ event: "started", row: idx, seq: cur.seq, clip, ms_from_cursor: Math.round(performance.now() - recvAt), server_ms_from_cursor: serverMs === null ? null : Math.round(serverMs) });
  };
  v.src = clip; v.currentTime = 0;
  v.play().catch((e) => { if (e && e.name !== "AbortError" && my === token) miss(); });
}

// Warm the HTTP cache for the rows Down/Up will reach next, so a start is not waiting on a disk or network read.
const warmed = new Set();
function warm(i) { if (i < 0 || warmed.has(i)) return; warmed.add(i); fetch(`/clips/${encodeURIComponent(SLUG)}/row-${i}.${EXT}`).then((r) => r.blob()).catch(() => {}); }
for (const i of [0, 1, 2]) warm(i);

function onCursor(ev) {
  const recvAt = performance.now(), cur = JSON.parse(ev.data);
  if (cur.seq === lastSeq) return;
  const first = lastSeq === -1; lastSeq = cur.seq;
  if (first && cur.current_line_index === null) return;   // nothing read yet
  lastIdx = cur.current_line_index; play(cur, recvAt);
  if (lastIdx !== null) for (const d of [-1, 1, 2]) warm(lastIdx + d);
}
const es = new EventSource("/events");   // the browser reconnects on its own; the first event after it is the cursor now
es.addEventListener("cursor", onCursor);
es.onopen = () => post({ event: "connected", row: lastIdx });
</script>
